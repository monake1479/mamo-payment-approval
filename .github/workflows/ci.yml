name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  pr-direction:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify integration and promotion direction
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != "dev" || "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
              echo "Only this repository's dev branch may be promoted into main."
              exit 1
            fi
          elif [[ "$BASE_REF" == "dev" ]]; then
            if [[ "$HEAD_REF" == "main" || "$HEAD_REF" == "dev" ]]; then
              echo "Implementation PRs into dev must originate from a work branch."
              exit 1
            fi
          else
            echo "Unsupported PR target."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned secret scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan publishable files and history
        run: python3 tool/scan_secrets.py --binary "$RUNNER_TEMP/gitleaks"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Record verification provenance
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/checkout-commit.txt
          flutter --version > evidence/flutter-version.txt
          printf '%s\n' "$GITHUB_SHA" > evidence/event-commit.txt
        # PR checkout is the test merge commit; record source head separately.
      - name: Record source commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: printf '%s\n' "$SOURCE_SHA" > evidence/source-commit.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee evidence/dependencies.log

      - name: Generate localizations
        shell: bash
        run: |
          set -o pipefail
          flutter gen-l10n 2>&1 | tee evidence/localizations.log

      - name: Verify formatting
        shell: bash
        run: |
          set -o pipefail
          dart format --output=none --set-exit-if-changed . 2>&1 | tee evidence/format.log

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee evidence/analyze.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test --machine > evidence/tests.jsonl 2> evidence/tests.stderr.log

      - name: Test local push tooling
        shell: bash
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s tool/tests -p 'test_*.py' -v 2>&1 | tee evidence/push-tooling.log

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
