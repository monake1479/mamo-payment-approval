appId: ${APP_ID}
name: Foundation launch and resume
---
- launchApp:
    clearState: true
- assertVisible:
    id: home.page
- assertVisible: Home
- assertNotVisible:
    id: app.failure
- takeScreenshot: foundation
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible:
    id: home.page
- assertVisible: Home
- assertNotVisible:
    id: app.failure
- takeScreenshot: resumed
