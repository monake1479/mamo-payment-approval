appId: ${APP_ID}
name: Foundation launch and resume
---
- launchApp:
    clearState: true
- assertVisible: Payment approval
- assertNotVisible:
    id: app.failure
- takeScreenshot: foundation
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: Payment approval
- assertNotVisible:
    id: app.failure
- takeScreenshot: resumed
