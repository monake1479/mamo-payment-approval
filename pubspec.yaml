publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
